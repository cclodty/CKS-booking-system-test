# 一鍵啟動：docker compose up -d
#   1) 等 db healthy 後執行  docker compose exec app php database/install.php
#   2) 瀏覽器開啟 http://localhost:8080
services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: booking_system
      MYSQL_USER: booking
      MYSQL_PASSWORD: booking
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"   # 需要用工具連進資料庫時使用；不需要可刪除

  app:
    build: ./docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: booking_system
      DB_USER: booking
      DB_PASS: booking
      APP_TIMEZONE: Asia/Hong_Kong
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"

volumes:
  db_data:
